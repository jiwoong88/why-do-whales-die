function frame(now){requestAnimationFrame(frame);
 let dt=Math.min(0.05,(now-last)/1000);last=now;
 if(ts<1)ts=Math.min(1,ts+dt*1.6);
 const gdt=dt*ts;
 if(!dead){
  breath=Math.max(0,Math.min(1,breath+(hold?dt*2.4:-dt*2.4)));
  const surf=breath>0.7;
  if(surf){const was=o2;o2=Math.min(1,o2+dt/2.2);
   if(o2<0.6)canB=true;
   if(was<1&&o2>=1&&canB){canB=false;cnB++;ts=0.25;$('flash').style.opacity=1;setTimeout(()=>$('flash').style.opacity=0,320);
    for(let i=0;i<40;i++){const a=Math.random()*6.283,v=30+Math.random()*120;parts.push({x:wh.x,y:wh.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0.6+Math.random()*0.5})}}}
  else o2-=dt/24;
  hg-=dt/38;
  /* 산소 부족 → 둔해짐 (난이도 — 50%부터 급감, 바닥에선 거의 정지) */
  const slow=o2>=0.5?1:(0.15+1.7*o2);
  const SPD=Math.min(W,H)*0.17*(surf?0.45:1)*slow;
  let tx=0,ty=0;
  if(keys.ArrowLeft||keys.KeyA)tx-=1;if(keys.ArrowRight||keys.KeyD)tx+=1;
  if(keys.ArrowUp||keys.KeyW)ty-=1;if(keys.ArrowDown||keys.KeyS)ty+=1;
  if(tx||ty){const m=Math.hypot(tx,ty);tx=tx/m*SPD;ty=ty/m*SPD}
  else if(ptr){const dx=ptr.x-wh.x,dy=ptr.y-wh.y,d=Math.hypot(dx,dy);
